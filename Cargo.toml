[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/db",
    "crates/ffi",
    "crates/blobstore",
    "crates/queue",
    "crates/player-bridge",
    "crates/features/stremio",
    "crates/features/torrent",
    "tools/uniffi-bindgen",
]
default-members = [
    "crates/core",
    "crates/db",
    "crates/ffi",
    "crates/blobstore",
    "crates/queue",
    "crates/player-bridge",
    "crates/features/stremio",
    "crates/features/torrent",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
cinma-core = { path = "crates/core" }
cinma-db = { path = "crates/db" }
cinma-blobstore = { path = "crates/blobstore" }
cinma-queue = { path = "crates/queue" }
cinma-player = { path = "crates/player-bridge" }
cinma-stremio = { path = "crates/features/stremio" }
cinma-torrent = { path = "crates/features/torrent" }
uniffi = "0.32.2"
rusqlite = "0.43.0"
thiserror = "2.0.21"
tempfile = "3.27.0"
tokio = { version = "1.54.1", default-features = false }
tokio-util = { version = "0.7.20", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
url = "2.5.8"
librqbit = { version = "9.1.0", default-features = false, features = ["rust-tls"] }
libloading = "0.9"
anyhow = "1"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
